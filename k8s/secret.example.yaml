# Copy to secret.yaml and fill in real values. Do NOT commit secret.yaml.
# Prefer creating it imperatively instead (see DEPLOY-k3s.md):
#   kubectl -n news create secret generic news-agent-secrets \
#     --from-literal=TELEGRAM_BOT_TOKEN=... \
#     --from-literal=TELEGRAM_ADMIN_CHAT_ID=... \
#     --from-literal=ANTHROPIC_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: news-agent-secrets
  namespace: news
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "123456:ABC-your-token"
  TELEGRAM_ADMIN_CHAT_ID: "123456789"
  ANTHROPIC_API_KEY: "sk-ant-..."   # leave empty to run without the agent
